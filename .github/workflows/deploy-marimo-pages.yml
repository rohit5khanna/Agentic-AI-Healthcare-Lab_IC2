name: Deploy Marimo learning lab to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "Agentic Learning Lab Marimo/**"
      - ".github/scripts/build_public_marimo.py"
      - ".github/workflows/deploy-marimo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Marimo
        run: python -m pip install "marimo==0.20.4"

      - name: Build public browser edition
        run: |
          python .github/scripts/build_public_marimo.py
          marimo check .pages/healthcare_agent_learning_lab_public.py
          marimo export html-wasm .pages/healthcare_agent_learning_lab_public.py --mode run --output _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
